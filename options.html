<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>APS Vault</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 16px; max-width: 460px; color: #0f172a; }
    h1 { font-size: 16px; margin-top: 0; }
    label { display: block; font-size: 13px; font-weight: 600; margin-top: 12px; }
    input { width: 100%; box-sizing: border-box; padding: 8px 10px; margin-top: 4px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; font-family: ui-monospace, monospace; }
    button { margin-top: 12px; padding: 8px 14px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    p, .help { font-size: 12px; color: #475569; margin: 6px 0; }
    code { background: #f1f5f9; padding: 1px 4px; border-radius: 3px; font-size: 12px; word-break: break-all; }
    #msg { font-size: 12px; margin-left: 8px; }
    .ok { color: #059669; } .err { color: #dc2626; }
  </style>
</head>
<body>
  <h1 data-i18n="opt_title"></h1>
  <label for="url" data-i18n="opt_url_label"></label>
  <input id="url" type="url" placeholder="https://vault.example.com" autocomplete="off">
  <div class="help" data-i18n="opt_url_help"></div>
  <label for="autolock" data-i18n="opt_autolock_label"></label>
  <input id="autolock" type="number" min="1" max="720" value="30">
  <div><button id="save" data-i18n="opt_save"></button><span id="msg"></span></div>
  <p data-i18n="opt_how"></p>
  <p><span data-i18n="opt_extension_id"></span><br><code id="origin"></code></p>
  <p>v0.2.0 · <a href="https://github.com/kzhebenev/aps-vault-extension" target="_blank" rel="noopener">GitHub</a></p>
  <script src="options.js"></script>
</body>
</html>
