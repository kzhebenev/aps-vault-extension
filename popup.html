<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>APS Vault</title>
  <style>
    body { margin: 0; width: 320px; background: #0a0e1a; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 14px; }
    h1 { font-size: 14px; margin: 0 0 12px 0; display: flex; align-items: center; gap: 8px; }
    input, button { width: 100%; padding: 8px 10px; background: #0f1320; border: 1px solid #1e2435; color: #e2e8f0; border-radius: 6px; font-size: 13px; box-sizing: border-box; font-family: ui-monospace, monospace; }
    input:focus { outline: none; border-color: #3b82f6; }
    button { background: #2563eb; color: white; cursor: pointer; border: none; margin-top: 8px; font-family: inherit; }
    button:hover { background: #3b82f6; }
    .btn-lock { background: #7f1d1d; } .btn-lock:hover { background: #991b1b; }
    .btn-ghost { background: #1e2435; } .btn-ghost:hover { background: #334155; }
    .status { font-size: 12px; color: #94a3b8; margin-bottom: 8px; }
    .status-ok { color: #10b981; } .status-locked { color: #f59e0b; }
    .hint { font-size: 11px; color: #64748b; margin-top: 6px; text-align: center; }
    .hint kbd { background: #1e2435; border: 1px solid #334155; padding: 1px 4px; border-radius: 3px; font-size: 10px; }
    #results { max-height: 260px; overflow-y: auto; margin-top: 6px; }
    .row { padding: 7px 8px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
    .row:hover, .row.sel { background: rgba(59,130,246,.15); color: #93c5fd; }
    .row .meta { color: #64748b; font-size: 11px; }
    .empty { color: #64748b; font-size: 12px; padding: 8px; text-align: center; }
  </style>
</head>
<body>
  <h1>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a8b3cf" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    APS Vault
  </h1>
  <div id="status" class="status">…</div>
  <div id="form-unlock" style="display:none">
    <input id="mp" type="password" data-i18n-ph="ph_master" autofocus>
    <input id="totp" type="text" data-i18n-ph="ph_totp" style="margin-top: 6px; display: none;" inputmode="numeric">
    <button id="btn-unlock" data-i18n="btn_unlock"></button>
  </div>
  <div id="form-unlocked" style="display:none">
    <!-- 0.3.0: search and copy live here, in the extension's own page — not in the web page -->
    <input id="search" type="text" data-i18n-ph="ph_search" autocomplete="off">
    <div id="results"></div>
    <button id="btn-vault" data-i18n="btn_open_vault"></button>
    <button id="btn-lock" class="btn-lock" data-i18n="btn_lock"></button>
  </div>
  <button id="btn-options" class="btn-ghost" data-i18n="btn_options"></button>
  <div class="hint"><span data-i18n="hint_hotkey"></span><kbd id="hotkey">Ctrl+Shift+L</kbd></div>
  <script src="popup.js"></script>
</body>
</html>
